name: JobHunter Automated Poller

on:
  workflow_dispatch: 
    
permissions:
  contents: read

jobs:
  poll-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite Database Cache
        uses: actions/cache/restore@v4
        with:
          path: data/jobhunter.db
          key: jobhunter-v8-db-${{ github.run_id }}
          restore-keys: |
            jobhunter-v8-db-

      - name: Ensure Directories Exist
        run: |
          mkdir -p data

      - name: Run JobHunter Poller
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.main --poll-once

      - name: Save SQLite Database Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/jobhunter.db
          key: jobhunter-v8-db-${{ github.run_id }}

      - name: Upload Database & Log Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobhunter-data-and-logs
          path: |
            data/jobhunter.db
            data/jobhunter.log
          retention-days: 14
