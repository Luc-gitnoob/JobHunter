<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JobHunter{% endblock %} — Dashboard</title>
    <meta name="description" content="Autonomous job hunting dashboard for tracking high-value backend engineering opportunities">
    <link rel="stylesheet" href="/static/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="layout">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-logo">
                <h1>🎯 JobHunter</h1>
                <span>Autonomous Engine</span>
            </div>
            <div class="sidebar-nav">
                <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
                    <span class="nav-icon">📋</span>
                    <span>Jobs</span>
                </a>
                <a href="/stats" class="{% if request.url.path == '/stats' %}active{% endif %}">
                    <span class="nav-icon">📊</span>
                    <span>Analytics</span>
                </a>
                <a href="/logs" class="{% if request.url.path == '/logs' %}active{% endif %}">
                    <span class="nav-icon">🔍</span>
                    <span>Poll Logs</span>
                </a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
