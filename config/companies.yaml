# Each entry needs: name, ats_platform, ats_slug, priority, geo_filter
#
# ATS platforms supported: greenhouse, lever, ashby, smartrecruiters
# The slug is found in the company's careers page URL:
#   - Greenhouse: boards.greenhouse.io/{slug}
