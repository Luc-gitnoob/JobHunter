# ============================================================
# python-jobspy Targeted Searches
# For Tier-1 employers with proprietary/enterprise ATS systems
# (Workday, Taleo, iCIMS, Internal)
# ============================================================
jobspy_searches:
  # Tier-1 Enterprise & Cloud ATS Targets (Workday / Taleo / Proprietary)
  - search_term: "Amazon SDE 1"
    location: "India"
    sites: ["linkedin"]
    results_wanted: 20

  - search_term: "Google Software Engineer"
    location: "India"
    sites: ["linkedin"]
    results_wanted: 20

