# ============================================================
# python-jobspy Fallback Searches
# For companies not on supported ATS platforms, or for
# broad keyword-based discovery on LinkedIn/Indeed.
# ============================================================
jobspy_searches:
  - search_term: "Backend Engineer"
    location: "India"
    sites: ["linkedin", "indeed"]
    results_wanted: 30

  - search_term: "Software Engineer Golang"
    location: "India"
    sites: ["linkedin", "indeed"]
    results_wanted: 20

  - search_term: "Software Engineer distributed systems"
    location: "Bangalore"
    sites: ["linkedin"]
    results_wanted: 20

  - search_term: "Razorpay Backend Engineer"
    location: "India"
    sites: ["linkedin"]
    results_wanted: 10

  - search_term: "Zerodha Software Engineer"
    location: "Bangalore"
    sites: ["linkedin"]
    results_wanted: 10
