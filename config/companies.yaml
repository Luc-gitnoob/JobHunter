# ============================================================
# python-jobspy Targeted Searches
# For top tech companies without public Greenhouse/Lever/Ashby/SmartRecruiters APIs
# (e.g., Flipkart, PhonePe, Zerodha, Atlassian, Postman)
# ============================================================
jobspy_searches:
  - search_term: "Flipkart Software Engineer"
    location: "India"
    sites: ["linkedin"]
    results_wanted: 20

  - search_term: "PhonePe Software Engineer"
    location: "India"
    sites: ["linkedin"]
    results_wanted: 15

  - search_term: "Postman Software Engineer"
    location: "India"
    sites: ["linkedin"]
    results_wanted: 15

  - search_term: "BrowserStack Software Engineer"
    location: "India"
    sites: ["linkedin"]
    results_wanted: 15

  - search_term: "Zerodha Software Engineer"
    location: "Bangalore"
    sites: ["linkedin"]
    results_wanted: 15

  - search_term: "Atlassian Software Engineer"
    location: "India"
    sites: ["linkedin"]
    results_wanted: 15

  - search_term: "Uber Software Engineer"
    location: "India"
    sites: ["linkedin"]
    results_wanted: 15

  # Selective fallback searches for high-scale backend roles
  - search_term: "SDE 1 Backend"
    location: "India"
    sites: ["linkedin"]
    results_wanted: 15

  - search_term: "Junior Backend Engineer"
    location: "India"
    sites: ["linkedin"]
    results_wanted: 15

  - search_term: "Software Development Engineer 1"
    location: "India"
    sites: ["linkedin"]
    results_wanted: 15

# ============================================================
# Instahyre Targeted Searches
# Direct API ingestion from Instahyre with Cloudflare bypass,
# targeted backend skills, and strict 0-1 YOE filtering.
# ============================================================
instahyre_searches:
  - job_functions: "10"               # Backend Development
    years: "1"                        # 1 YOE
    skills: ["Golang", "Java", "Python", "Backend"]
    locations: ["Bangalore", "Hyderabad", "Pune", "Gurgaon", "Work From Home"]
    results_wanted: 30

  - job_functions: "10"               # Backend Development (Entry level / 0 YOE)
    years: "0"
    skills: ["Golang", "Java", "Python"]
    locations: ["Bangalore", "Hyderabad", "Pune", "Gurgaon", "Work From Home"]
    results_wanted: 20

