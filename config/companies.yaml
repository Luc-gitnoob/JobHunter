# ============================================================
# Target Company Catalog
# Add companies you want to monitor here.
# Each entry needs: name, ats_platform, ats_slug
#
# ATS platforms supported: greenhouse, lever, ashby, smartrecruiters
# The slug is found in the company's careers page URL:
#   - Greenhouse: boards.greenhouse.io/{slug}
#   - Lever: jobs.lever.co/{slug}
#   - Ashby: jobs.ashbyhq.com/{slug}
#   - SmartRecruiters: jobs.smartrecruiters.com/{slug}
# ============================================================

