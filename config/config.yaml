# ============================================================
# JobHunter — Main Configuration
# ============================================================

# Polling schedule
scheduler:
  poll_interval_minutes: 240
  # Stagger requests to avoid burst traffic
  request_delay_seconds: 2

# Pre-filter rules (applied BEFORE LLM scoring to save API calls)
filters:
  # Job titles must contain at least one of these (case-insensitive)
  title_include:
    - "software engineer"
    - "software developer"
    - "software development engineer"
    - "sde"
    - "swe"
    - "backend"
    - "back-end"
    - "back end"
    - "full stack"
    - "fullstack"
    - "full-stack"
    - "golang"
    - "go developer"
    - "c# developer"
    - ".net developer"
    - "java developer"
    - "associate engineer"

  # Jobs with these in the title are immediately dropped
  title_exclude:
    - "senior"
    - "staff"
    - "principal"
    - "lead"
    - "manager"
    - "director"
    - "vp"
    - "head of"
    - "architect"
    - "mobile"
    - "ios"
    - "android"
    - "designer"
    - "ui/ux"
    - "marketing"
    - "sales"
    - "growth"
    - "recruiter"
    - "talent"
    - "human resources"
    - "account executive"
    - "business development"
    - "product manager"
    - "project manager"
    - "program manager"
    - "data scientist"
    - "machine learning"
    - "ai researcher"
    - "devops"
    - "sre"
    - "qa"
    - "test engineer"
    - "intern"
    - "co-op"
    - "working student"
    - "apprentice"

  # Maximum allowed YOE upper bound: 'auto' dynamically calculates from career_start_date in profile.yaml (<2 YOE in 2026, <3 YOE in 2027)
  max_yoe_mentioned: auto

# LLM Scoring
scoring:
  min_score: 70                   # Only generate resume + notify for scores >= this
  model: "gemini-3.5-flash-lite"  # High throughput, fast latency, high quota
  temperature: 0.3                # Low temp for consistent scoring

# Resume generation
resume:
  output_dir: "output/resumes"
  latex_compiler: "pdflatex"  # or xelatex, lualatex

# Telegram notifications
telegram:
  # Message format: rich markdown with inline buttons
  include_referral_pitch: true
  include_match_analysis: true
