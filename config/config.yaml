# ============================================================
# JobHunter — Main Configuration
# ============================================================

# Polling schedule
scheduler:
  poll_interval_minutes: 1440  # Once a day (every 24 hours)
  # Stagger requests to avoid burst traffic
  request_delay_seconds: 2

# Pre-filter rules (applied BEFORE LLM scoring to save API calls)
filters:
  # Job titles must contain at least one of these (case-insensitive)
  title_include:
    - "software engineer"
    - "software developer"
    - "software development engineer"
    - "software dev engineer"
    - "dev engineer"
    - "sde"
    - "swe"
    - "backend"
    - "back-end"
    - "back end"
    - "full stack"
    - "fullstack"
    - "full-stack"
    - "golang"
    - "go developer"
    - "c# developer"
    - ".net developer"
    - "java developer"
    - "associate engineer"

  # Jobs with these in the title are immediately dropped
  title_exclude:
    - "senior"
    - "staff"
    - "principal"
    - "lead"
    - "manager"
    - "director"
    - "vp"
    - "head of"
    - "architect"
    - "expert"
    - "advanced"
    - "intermediate"
    - "specialist"
    - "sr."
    - "sr"
    - "l3"
    - "l-3"
    - "l 3"
    - "l4"
    - "l-4"
    - "l 4"
    - "l5"
    - "level 3"
    - "level 4"
    - "level 5"
    - "sde ii"
    - "sde 2"
    - "sde-ii"
    - "sde-2"
    - "sde iii"
    - "sde 3"
    - "sde-iii"
    - "sde-3"
    - "sde iv"
    - "sde 4"
    - "swe ii"
    - "swe 2"
    - "swe-ii"
    - "swe-2"
    - "swe iii"
    - "swe 3"
    - "swe-iii"
    - "swe-3"
    - "swe iv"
    - "swe 4"
    - "engineer ii"
    - "engineer 2"
    - "engineer iii"
    - "engineer 3"
    - "developer ii"
    - "developer 2"
    - "developer iii"
    - "developer 3"
    - "mid-level"
    - "mid level"
    - "experienced"
    - "mobile"
    - "ios"
    - "android"
    - "designer"
    - "ui/ux"
    - "marketing"
    - "sales"
    - "growth"
    - "recruiter"
    - "talent"
    - "human resources"
    - "account executive"
    - "business development"
    - "product manager"
    - "project manager"
    - "program manager"
    - "data scientist"
    - "machine learning"
    - "ai researcher"
    - "devops"
    - "sre"
    - "qa"
    - "test engineer"
    - "intern"
    - "co-op"
    - "working student"
    - "apprentice"

  # Maximum allowed YOE upper bound: 'auto' dynamically calculates from career_start_date in profile.yaml (<2 YOE in 2026, <3 YOE in 2027)
  max_yoe_mentioned: auto

  # Agency / Staffing / Consultancy / Publication keywords in company name
  # Automatically filters out bodyshops and non-tech publications from broad scrapers
  company_exclude:
    - "staffing"
    - "recruitment"
    - "recruiter"
    - "recruiters"
    - "consulting"
    - "consultancy"
    - "consultants"
    - "solutions"
    - "infotech"
    - "technologies"
    - "services"
    - "manpower"
    - "talent"
    - "placements"
    - "outsourcing"
    - "partners"
    - "ventures"
    - "advisors"
    - "advisory"
    - "workforce"
    - "resource"
    - "resources"
    - "outlook"
    - "umanist"
    - "golden opportunities"

# LLM Scoring
scoring:
  min_score: 70                   # Only generate resume + notify for scores >= this
  model: "gemini-3.5-flash-lite"  # High throughput, fast latency, accurate scoring
  temperature: 0.3                # Low temp for consistent scoring

# Resume generation
resume:
  output_dir: "output/resumes"
  latex_compiler: "pdflatex"  # or xelatex, lualatex

# Telegram notifications
telegram:
  # Message format: rich markdown with inline buttons
  include_referral_pitch: true
  include_match_analysis: true
