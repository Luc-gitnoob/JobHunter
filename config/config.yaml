# ============================================================
# JobHunter — Main Configuration
# ============================================================

# Polling schedule
scheduler:
  poll_interval_minutes: 1440  # Once a day (every 24 hours)
  # Stagger requests to avoid burst traffic
  request_delay_seconds: 2

# Pre-filter rules (applied BEFORE LLM scoring to save API calls)
filters:
  # Job titles must contain at least one of these (case-insensitive)
  title_include:
    - "software engineer"
    - "software developer"
    - "software development engineer"
    - "software dev engineer"
    - "dev engineer"
    - "sde"
    - "swe"
    - "backend"
    - "back-end"
    - "back end"
    - "full stack"
    - "fullstack"
    - "full-stack"
    - "golang"
    - "go developer"
    - "c# developer"
    - ".net developer"
    - "java developer"
    - "associate engineer"
    # MTS Hierarchy (Nutanix, Salesforce, Oracle Cloud, Adobe, Arcesium, Cohesity)
    - "member of technical staff"
    - "associate member of technical staff"
    - "mts"
    - "associate mts"
    # Banking GCC Titles (Goldman Sachs, Morgan Stanley, BlackRock)
    - "analyst"
    - "technology analyst"
    - "software engineering analyst"
    - "software engineer analyst"
    - "developer analyst"
    # Systems / Low-Latency
    - "systems engineer"
    - "c++ developer"
    - "c++ software engineer"
    - "c/c++ developer"

  # Jobs with these in the title are immediately dropped
  title_exclude:
    - "senior"
    - "staff"
    - "staff engineer"
    - "staff software engineer"
    - "staff developer"
    - "staff sde"
    - "staff swe"
    - "chief of staff"
    - "principal"
    - "lead"
    - "manager"
    - "director"
    - "vp"
    - "head of"
    - "architect"
    - "expert"
    - "advanced"
    - "intermediate"
    - "specialist"
    - "sr."
    - "sr"
    # Note: Google L3 / Level 3 is standard entry-level SDE-1, so L3 is explicitly NOT excluded
    - "l4"
    - "l-4"
    - "l 4"
    - "l5"
    - "level 4"
    - "level 5"
    - "sde ii"
    - "sde 2"
    - "sde-ii"
    - "sde-2"
    - "sde iii"
    - "sde 3"
    - "sde-iii"
    - "sde-3"
    - "sde iv"
    - "sde 4"
    - "swe ii"
    - "swe 2"
    - "swe-ii"
    - "swe-2"
    - "swe iii"
    - "swe 3"
    - "swe-iii"
    - "swe-3"
    - "swe iv"
    - "swe 4"
    - "engineer ii"
    - "engineer 2"
    - "engineer iii"
    - "engineer 3"
    - "developer ii"
    - "developer 2"
    - "developer iii"
    - "developer 3"
    - "mid-level"
    - "mid level"
    - "experienced"
    - "mobile"
    - "ios"
    - "android"
    - "designer"
    - "ui/ux"
    - "marketing"
    - "sales"
    - "growth"
    - "recruiter"
    - "talent"
    - "human resources"
    - "account executive"
    - "business development"
    - "product manager"
    - "project manager"
    - "program manager"
    - "data scientist"
    - "machine learning"
    - "ai researcher"
    - "devops"
    - "sre"
    - "qa"
    - "test engineer"
    - "intern"
    - "co-op"
    - "working student"
    - "apprentice"

    # Degree / Education Exclusions (Candidate holds B.Tech)
    - "phd"
    - "ph.d"
    - "doctorate"
    - "postdoc"

    # Future / Campus Batch Exclusions (Candidate graduated 2025 and is in workforce)
    - "2027"
    - "2028"
    - "2029"
    - "campus hire"

    # Non-technical / Compliance / Risk Exclusions (Guards against non-SWE roles)
    - "risk"
    - "compliance"
    - "aml"
    - "fraud"
    - "kyc"
    - "sanctions"
    - "risk management"
    - "business analyst"
    - "financial analyst"
    - "data analyst"
    - "operations analyst"
    - "risk analyst"
    - "credit analyst"
    - "compliance analyst"
    - "investment banking analyst"
    - "equity research analyst"

    # Contractor / Freelance Exclusions
    - "contractor"
    - "freelance"
    - "freelancer"

  # Maximum allowed YOE upper bound: 'auto' dynamically calculates from career_start_date in profile.yaml (<2 YOE in 2026, <3 YOE in 2027)
  max_yoe_mentioned: auto

  # Minimum explicit CTC threshold in LPA (INR)
  # Any posting explicitly stating an upper salary below this (e.g. 3-6 LPA, 10 LPA) is dropped
  min_salary_lpa: 18

  # Business model / agency keywords in company name
  # Filters out third-party staffing agencies, bodyshops, and recruitment vendors
  company_exclude:
    - "staffing"
    - "recruitment"
    - "recruiter"
    - "recruiters"
    - "consulting"
    - "consultancy"
    - "consultants"
    - "solutions"
    - "infotech"
    - "services"
    - "manpower"
    - "talent"
    - "placements"
    - "outsourcing"
    - "offshoring"
    - "partners"
    - "advisors"
    - "advisory"
    - "workforce"
    - "resource"
    - "resources"
    - "flexiple"

# LLM Scoring
scoring:
  min_score: 85                   # High-caliber benchmark: Top-tier product unicorns, FAANG, & Tier-1 GCCs (>= 18 LPA)
  model: "gemini-3.5-flash-lite"  # High free tier quota (hundreds of requests/day) vs 20 RPD cap on full 3.6 flash
  temperature: 0.3                # Low temp for consistent scoring

# Telegram notifications
telegram:
  # Message format: rich markdown with inline buttons
  include_referral_pitch: true
  include_match_analysis: true
